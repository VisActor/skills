<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>整体展开与增量接入 · 局部机制</title>
  <link rel="stylesheet" href="../mechanism.css">
</head>
<body>
<main>
  <nav class="eyebrow"><a href="../index.html#mechanisms">全部示例</a> / 局部机制 · amounts</nav>
  <section id="amount-example" class="mechanism-section">
    <h1>整体展开与增量接入</h1>
    <p>同一批新增量，可以展开解释组成，也可以接到已有量上。移动原有分段，让长度与加总关系贯穿各状态。</p>
    <div id="amount-buttons" class="controls state-controls" role="group" aria-label="组成与累积视图">
      <button data-mode="whole" aria-pressed="true">新增整体</button>
      <button data-mode="parts" aria-pressed="false">展开组成</button>
      <button data-mode="base" aria-pressed="false">接入原有量</button>
      <button data-mode="total" aria-pressed="false">读累计总量</button>
    </div>
    <div class="plot"><svg id="amounts" viewBox="0 0 860 440" role="img" aria-label="可加总模拟数量的组成与累积" aria-describedby="amount-summary"></svg></div>
    <p id="amount-summary" class="result" aria-live="polite"></p>
    <details id="example-notes" class="scope"><summary>表达理由与改编</summary>
  <p><strong>表达理由：</strong><a href="../../../references/expression-methods.md#组成与累积">组成与累积</a>：展开使整体中的分项可辨；把同批分项接上基底，再看新增、原有与累计端点的关系。两种操作可分别取用。</p>
  <p><strong>改编与接线：</strong>同单位、不重复的非负量可沿用区间计算。<code>amountExample</code> 配基底、分项、单位与精度，<code>amountPose</code> 改排列。可换题材、方向、素材和分组；只问组成用展开，负项或流出需另写净变化几何。</p>
  <p><a href="scene.mjs">本例数据与代码</a></p>
</details>
  </section>
  <footer><a href="scene.mjs">本例数据与动画代码</a> · <a href="../mechanism.css">控件与预览样式</a></footer>
</main>
<script type="module">
  import { mountAmounts } from "./scene.mjs";
  const example = mountAmounts(document.querySelector("#amount-example"));
  addEventListener("pagehide", event => { if (!event.persisted) example.dispose(); });
</script>
</body>
</html>
