<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单套穿搭拆解 · 编辑模板</title><style>:root{--paper:#F5F2EB;--ink:#2C2D29;--accent:#514D45;--on-accent:#FFFFFF;--outfit-bg-image:none;--outfit-bg-size:44px 44px;--outline:#FFFCF5;--panel:transparent;--rule:#514D4530}
*{box-sizing:border-box}body{margin:0;background:#ddd;color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}h1,h2,p,figure{margin:0}article[data-page]{width:var(--page-width,1080px);height:var(--page-height,1920px);padding:52px 60px;position:relative;margin:0 auto 36px;background-color:var(--paper);background-image:var(--outfit-bg-image);background-size:var(--outfit-bg-size)}
.detail-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:18px}.detail-header h1{font-size:38px;font-weight:500;letter-spacing:2px}.detail-header p{font-size:22px}.breakdown{display:grid;grid-template-columns:240px minmax(0,1fr) 240px;grid-template-rows:repeat(3,minmax(0,1fr));gap:24px 20px;min-height:0}.full-look{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0}.full-look img{width:100%;min-height:0;flex:1 1 0;object-fit:contain;filter:drop-shadow(3px 0 var(--outline)) drop-shadow(-3px 0 var(--outline)) drop-shadow(0 3px var(--outline)) drop-shadow(0 -3px var(--outline))}.full-look figcaption{font-size:21px;margin-top:10px;letter-spacing:2px}.item{position:relative;min-height:0;border:1px solid var(--rule);background:var(--panel);border-radius:3px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}.item img{width:100%;min-height:0;flex:1 1 0;object-fit:contain}.item figcaption{width:100%;padding-top:8px}.item h2{font-size:25px;font-weight:500;line-height:1.5}.item p{font-size:20px;line-height:1.5;margin-top:4px}.item-no{position:absolute;left:12px;top:8px;font-size:18px;color:var(--accent)}.outer{grid-column:3;grid-row:1}.inner{grid-column:1;grid-row:2}.pants{grid-column:3;grid-row:2}.bag{grid-column:1;grid-row:3}.shoes{grid-column:3;grid-row:3}.detail-note{grid-column:1;grid-row:1;padding:15px 4px}.detail-note .eyebrow{font-size:20px;letter-spacing:2px}.detail-note h2{font-family:"Noto Serif SC","Songti SC",serif;font-size:37px;line-height:1.35;margin:18px 0}.detail-note p{font-size:23px;line-height:1.6}.detail-summary{border-top:1px solid var(--rule);padding-top:24px;display:grid;grid-template-columns:240px 1fr;gap:36px}.detail-swatches{display:flex;gap:22px;align-items:flex-start}.detail-swatches span{font-size:21px;display:flex;flex-direction:column;gap:10px;align-items:center}.detail-swatches i{width:26px;height:26px;border-radius:50%;border:1px solid var(--rule)}.detail-summary p{font-size:26px;line-height:1.65}.detail-footer{position:static;margin:0;border-top:1px solid var(--rule);padding-top:14px;font-size:20px;display:flex;justify-content:space-between}

/* Let the captions and analysis take the space they need, then size the photographs. */
article[data-template="outfit-detail"] {
  container: outfit-page / size;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  row-gap: 24px;
}
.full-look figcaption, .item figcaption { flex: none; }

/* On a tall page, give the last two details a wider frame below the full outfit. */
@container outfit-page (max-aspect-ratio: 2/3) {
  .breakdown:has(> .bag):has(> .shoes) {
    grid-template-columns: 22% 1fr 1fr 22%;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) minmax(0, .62fr);
    grid-template-areas:
      "note  full  full  outer"
      "inner full  full  pants"
      "bag   bag   shoes shoes";
  }
  .breakdown:has(> .bag):has(> .shoes) > .detail-note { grid-area: note; }
  .detail-note h2 { font-size: 30px; text-wrap: balance; }
  .breakdown:has(> .bag):has(> .shoes) > :is(.outer, .inner, .pants) { justify-content: center; }
  .breakdown:has(> .bag):has(> .shoes) > :is(.outer, .inner, .pants) img { flex: none; height: auto; max-height: 64%; }
  .breakdown:has(> .bag):has(> .shoes) > .full-look { grid-area: full; }
  .breakdown:has(> .bag):has(> .shoes) > .outer { grid-area: outer; }
  .breakdown:has(> .bag):has(> .shoes) > .inner { grid-area: inner; }
  .breakdown:has(> .bag):has(> .shoes) > .pants { grid-area: pants; }
  .breakdown:has(> .bag):has(> .shoes) > .bag { grid-area: bag; }
  .breakdown:has(> .bag):has(> .shoes) > .shoes { grid-area: shoes; }
}

/* Fewer than four details share one column; only the available photos create rows. */
.breakdown:not(:has(> .item ~ .item ~ .item ~ .item)) {
  grid-template-areas: none;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  grid-template-rows: auto repeat(var(--item-count, 1), minmax(0, 1fr));
}
.breakdown:has(> .item ~ .item) { --item-count: 2; }
.breakdown:has(> .item ~ .item ~ .item) { --item-count: 3; }
.breakdown:not(:has(> .item ~ .item ~ .item ~ .item)) > .full-look { grid-area: 1 / 1 / -1 / 2; }
.breakdown:not(:has(> .item ~ .item ~ .item ~ .item)) > :is(.detail-note, .item) { grid-area: auto / 2; }
