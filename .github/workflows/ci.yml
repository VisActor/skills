name: Skills CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check skills tests .github/scripts
      - run: uv run --locked pytest tests -q -m "not poster_browser"
      - name: Validate Skill release packages from this commit
        run: uv run --locked python .github/scripts/package_skills.py --commit HEAD --tag skills-v0.0.0 --output .cache/ci-release-artifacts
      - name: Preview release plan for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python .github/scripts/release_plan.py --mode preview --output .cache/release-preview
      - name: Save release preview packages
        if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: skills-release-preview
          path: .cache/release-preview/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser smoke (no model)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: uv sync --locked
      - run: npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: uv run --locked python -m playwright install --with-deps chromium
      - run: uv run --locked pytest tests/person_poster -q -m poster_browser
      - run: node --test tests/test_browser_assets.mjs tests/test_browser_checks.mjs tests/test_story_vseed.cjs tests/test_person_poster_runtime.mjs
      - run: uv run --locked python tests/browser/scripts/smoke.py --output-dir .cache/ci-browser-smoke
      - name: Save browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-smoke
          path: |
            .cache/ci-browser-smoke/summary.json
            .cache/ci-browser-smoke/*/*.json
            .cache/ci-browser-smoke/*/*.log
            .cache/ci-browser-smoke/*/*.png
            .cache/ci-browser-smoke/*/workspace/inputs/
            .cache/ci-browser-smoke/*/workspace/outputs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
